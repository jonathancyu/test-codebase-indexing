[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Backend code for three tier application"
authors = ["8090 Software Factory"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.117.1"
uvicorn = "^0.27.0"
psycopg2-binary = "^2.9.9"
sqlmodel = "^0.0.16"
boto3 = "^1.34.0"
mangum = "^0.17.0"
setuptools = "^80.9.0"
service_connections = "^0.1.6"
environment_variable_manager = "^0.2.1"
database-management = "^0.1.11"
h11 = "^0.16.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^24.1.1"
ruff = "^0.1.8"
isort = "^5.13.2"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
httpx = "^0.26.0"  # For testing FastAPI endpoints
pytest-mock = "^3.12.0"
faker = "^22.5.0"  # For generating test data
pytest-env = "^1.1.3"  # For environment variables in tests
aioresponses = "^0.7.6"  # For mocking async HTTP requests
freezegun = "^1.4.0"  # For time-based testing

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/migrations/
''' 

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
extend_skip = ["migrations"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[[tool.poetry.source]]
name = "codeartifact"
url = "https://packages-982534352120.d.codeartifact.us-west-2.amazonaws.com/pypi/pypi-store/simple/"
priority = "supplemental"